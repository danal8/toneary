name: Build popular album candidates
on:
  push:
    paths: ['scripts/build-popular-index.mjs']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-popular-index.mjs
