name: Deploy Toneary to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Verify live album audience service
        if: contains(github.event.head_commit.message, '[audience-check]')
        run: node scripts/audience-smoke.mjs
      - name: Verify live review sources
        if: contains(github.event.head_commit.message, '[reviews-check]')
        run: node scripts/reviews-smoke.mjs
      - name: Verify album review layout
        if: contains(github.event.head_commit.message, '[reviews-check]')
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/reviews-ui-smoke.mjs
      - name: Save layout verification
        if: always() && contains(github.event.head_commit.message, '[reviews-check]')
        uses: actions/upload-artifact@v4
        with:
          name: album-review-layout
          path: _qa/
          if-no-files-found: ignore
      - name: Verify genre ranking and selector
        if: contains(github.event.head_commit.message, '[genre-check]')
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/genre-ui-smoke.mjs
      - name: Save genre verification
        if: always() && contains(github.event.head_commit.message, '[genre-check]')
        uses: actions/upload-artifact@v4
        with:
          name: genre-layout
          path: _qa/
          if-no-files-found: ignore
      - name: Verify navigation and manual recommendations
        if: contains(github.event.head_commit.message, '[navigation-check]')
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/navigation-daily-smoke.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js api.js audience.js reviews.js genres.js public-config.js account.js account-ui.js sync-store.js storage.js private-store.js credits.js artist-library.js search.js ui-search.js discovery.js sw.js manifest.webmanifest .nojekyll _site/
          cp -r assets data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
