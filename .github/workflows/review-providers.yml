name: Review provider verification
on:
  push:
    paths: ['scripts/review-provider-probe.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-provider-probe.mjs
